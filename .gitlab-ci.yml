include:
  - local: .ci/core.yml
  - local: '*/.gitlab-ci.yml'
  - local: 'orchestration/*/.gitlab-ci.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
      auto_cancel:
        on_new_commit: none
    - when: always
      auto_cancel:
        on_new_commit: interruptible

stages:
  - build
  - test
  - docker
  - publish
  - ci
  - trigger
  - scan
  - release

"Core Build":
  extends:
    - .gradle
  stage: build
  tags:
    - heavy
  needs: []
  variables:
    OPENAPI_SPEC: deltafi-core/src/main/resources/openapi/openapi.yaml
    OPENAPI_IGNORED_ERRORS: deltafi-core/src/main/resources/openapi/ignored-errors.md
    OPENAPI_BASE_REF: dev
  script:
    - sdk install gradle ${GRADLE_VERSION}
    - ${GRADLE} license assemble test dockerPrepare :deltafi-core:generateOpenApiSpec
    # 1. Drift check (git add -N makes a not-yet-committed spec visible to git diff)
    - git add -N "${OPENAPI_SPEC}"
    - |
      if ! git diff --exit-code -- "${OPENAPI_SPEC}"; then
        echo "ERROR: ${OPENAPI_SPEC} is out of date."
        echo "Run './gradlew :deltafi-core:generateOpenApiSpec' locally and commit the result."
        exit 1
      fi
    # 2. Breaking-change check vs the integration branch
    - curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh
    - git fetch --depth=1 origin "${OPENAPI_BASE_REF}" || true
    - |
      if git cat-file -e "origin/${OPENAPI_BASE_REF}:${OPENAPI_SPEC}" 2>/dev/null; then
        git show "origin/${OPENAPI_BASE_REF}:${OPENAPI_SPEC}" > /tmp/base-openapi.yaml
        oasdiff breaking /tmp/base-openapi.yaml "${OPENAPI_SPEC}" --fail-on ERR --err-ignore "${OPENAPI_IGNORED_ERRORS}"
      else
        echo "No base spec on origin/${OPENAPI_BASE_REF}; skipping breaking-change check (first run)."
      fi
  artifacts:
    when: always
    reports:
      junit: "**/build/test-results/test/**/TEST-*.xml"
    paths:
      - "**/build"
      - ".gradle"
      - "${OPENAPI_SPEC}"
    exclude:
      - "**/build/tmp"
      - "**/build/classes"

"Build Installer Distros":
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'
  tags:
    - heavy
  extends:
    - .gradle-build
    - .golang
  stage: build
  script:
    - ${GRADLE} --rerun-tasks dist
    - tree build/*
  artifacts:
    when: always
    paths:
      - "build"

"Maven Artifacts to Nexus":
  allow_failure: true
  tags:
    - heavy
  extends:
    - .publish
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'
  script:
    - cat ${GPG_SIGNING_KEY} | base64 -d > ${GPG_SIGNING_KEY}.signing.gpg
    - ${GRADLE} -Psigning.keyId="${GPG_SIGNING_KEY_ID}" -Psigning.password="${GPG_SIGNING_PASSWORD}" -Psigning.secretKeyRingFile="${GPG_SIGNING_KEY}.signing.gpg" -PsonatypeNexusUsername="${SONATYPE_NEXUS_USERNAME}" -PsonatypeNexusPassword="${SONATYPE_NEXUS_PASSWORD}" publishToSonatype closeAndReleaseStagingRepositories

"Plugin to gradle.org":
  tags:
    - heavy
  extends:
    - .publish
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'
  script:
    - cat ${GPG_SIGNING_KEY} | base64 -d > ${GPG_SIGNING_KEY}.signing.gpg
    - ${GRADLE} -Psigning.keyId="${GPG_SIGNING_KEY_ID}" -Psigning.password="${GPG_SIGNING_PASSWORD}" -Psigning.secretKeyRingFile="${GPG_SIGNING_KEY}.signing.gpg" -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}" -PpublishToGradleOrg publishPlugin

"SNAPSHOT Maven Artifacts to GitLab":
  stage: publish
  tags:
    - heavy
  extends:
    - .publish
  rules:
    - if: $CI_PROJECT_NAMESPACE == 'deltafi'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == 'dev'
    - if: $CI_COMMIT_BRANCH == 'main'
  script:
    - cat ${GPG_SIGNING_KEY} | base64 -d > ${GPG_SIGNING_KEY}.signing.gpg
    - ${GRADLE} -PprojectMavenRepo="https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/maven" -Psigning.keyId="${GPG_SIGNING_KEY_ID}" -Psigning.password="${GPG_SIGNING_PASSWORD}" -Psigning.secretKeyRingFile="${GPG_SIGNING_KEY}.signing.gpg" publishAllPublicationsToGitlabRepository
    - ${GRADLE} -PprojectMavenRepo="https://gitlab.com/api/v4/projects/44592703/packages/maven" -Psigning.keyId="${GPG_SIGNING_KEY_ID}" -Psigning.password="${GPG_SIGNING_PASSWORD}" -Psigning.secretKeyRingFile="${GPG_SIGNING_KEY}.signing.gpg" publishAllPublicationsToGitlabRepository

"Maven Artifacts to GitLab":
  stage: publish
  tags:
    - heavy
  extends:
    - .publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cat ${GPG_SIGNING_KEY} | base64 -d > ${GPG_SIGNING_KEY}.signing.gpg
    - ${GRADLE} -PprojectMavenRepo="https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/maven" -Psigning.keyId="${GPG_SIGNING_KEY_ID}" -Psigning.password="${GPG_SIGNING_PASSWORD}" -Psigning.secretKeyRingFile="${GPG_SIGNING_KEY}.signing.gpg" publishAllPublicationsToGitlabRepository

# Trigger project for triggering downstream plugins
"Trigger Plugin Jobs":
  stage: trigger
  variables:
    TRIGGER_BRANCH: $CI_COMMIT_REF_NAME
    TRIGGER_TAG: $CI_COMMIT_TAG
    DELTAFI_CORE_REPO: gitlab.com/$CI_PROJECT_NAMESPACE/deltafi
    DELTAFI_CORE_BRANCH: $CI_COMMIT_REF_NAME
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  trigger:
    project: $CI_PROJECT_NAMESPACE/ci-plugin-triggers
    branch: main
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false

"Grype Scan":
  extends:
    - .container_scanning
  variables:
    CS_ANALYZER_IMAGE: "$CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning/grype:5"

"Trivy Scan":
  extends:
    - .container_scanning
  variables:
    CS_ANALYZER_IMAGE: "$CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning/trivy:5"

"Installer Distros":
  stage: publish
  image: curlimages/curl:latest
  needs:
    - job: "Build Installer Distros"
  tags:
    - light
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'
  script:
    - |
      # Read version from VERSION file
      VERSION=$(cat VERSION)
      if [ -z "$VERSION" ]; then
        echo "Error: Could not read version from VERSION file"
        exit 1
      fi
      echo "Using version: $VERSION"
      DIST_LIST="distribution.md"
      echo "### Distribution Files" > $DIST_LIST
      echo "" >> $DIST_LIST

      # Process each .tgz file
      ls -la build/dist/*.tgz
      for file in build/dist/*.tgz; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          echo "Publishing $filename to package registry..."
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --upload-file "$file" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${VERSION}/${filename}"
          echo "* [$filename](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${VERSION}/${filename})" >> $DIST_LIST
        fi
      done
  artifacts:
    paths:
      - distribution.md

"Linux-arm64 installer image":
  extends: .distro-containers
  variables:
    ARCH: arm64
    OS: linux
  needs:
    - job: "Installer Distros"
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'

"Linux-amd64 installer image":
  extends: .distro-containers
  variables:
    ARCH: amd64
    OS: linux
  needs:
    - job: "Installer Distros"
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'

"Darwin-arm64 installer image":
  extends: .distro-containers
  variables:
    ARCH: arm64
    OS: darwin
  needs:
    - job: "Installer Distros"
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'

"Darwin-amd64 installer image":
  extends: .distro-containers
  variables:
    ARCH: amd64
    OS: darwin
  needs:
    - job: "Installer Distros"
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'

Release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG && $CI_PROJECT_NAMESPACE == 'deltafi'
  needs:
    - job: "Installer Distros"
      optional: true
  script:
    - echo "Release Job"
    - cp ./CHANGELOG/latest.md release_notes.md
    - echo >> release_notes.md
    - cat distribution.md >> release_notes.md
  release:
    name: '$CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: "release_notes.md"
    assets:
      links:
        - name: "deltafi ${CI_COMMIT_TAG} (linux, amd64, tgz)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/deltafi-${CI_COMMIT_TAG}-linux-amd64.tgz"
          link_type: "package"
        - name: "deltafi ${CI_COMMIT_TAG} (linux, arm64, tgz)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/deltafi-${CI_COMMIT_TAG}-linux-arm64.tgz"
          link_type: "package"
        - name: "deltafi ${CI_COMMIT_TAG} (darwin, amd64, tgz)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/deltafi-${CI_COMMIT_TAG}-darwin-amd64.tgz"
          link_type: "package"
        - name: "deltafi ${CI_COMMIT_TAG} (darwin, arm64, tgz)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/deltafi-${CI_COMMIT_TAG}-darwin-arm64.tgz"
          link_type: "package"
  artifacts:
    paths:
      - release_notes.md
