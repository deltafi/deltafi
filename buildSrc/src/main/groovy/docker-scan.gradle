// ABOUTME: Adds 'grype' and 'trivy' tasks that scan the project's Docker image for vulnerabilities.
// ABOUTME: Shared by the monorepo (via docker-conventions) and downstream plugins (via plugin-convention).
import org.deltafi.gradle.cli.ExecHelper
import org.deltafi.gradle.cli.ToolRunner
import org.deltafi.gradle.security.Severity

plugins {
    id 'org.deltafi.docker'
}

def securityScanExecHelper = objects.newInstance(ExecHelper)

// Config-time captures shared by grype/trivy/sbom. All references to project/rootProject must
// happen here (config time) — task doLast bodies are forbidden from touching them per Gradle 9's
// Task.project deprecation, since that breaks the configuration cache.
def projectName = project.name
def projectVersion = project.version
def rootBuildDir = rootProject.layout.buildDirectory

def grypeJsonOutput = rootBuildDir.file("grype-results/${projectName}-grype-results.json").get().asFile
def grypeSarifOutput = rootBuildDir.file("grype-results/${projectName}-grype-results.sarif").get().asFile
def trivyJsonOutput = rootBuildDir.file("trivy-results/${projectName}-trivy-results.json").get().asFile
def trivySarifOutput = rootBuildDir.file("trivy-results/${projectName}-trivy-results.sarif").get().asFile

// State that depends on docker { ... } config or the rootProject's securityScan extension is
// resolved during afterEvaluate, then closed over by the task doLast bodies.
def scanImageName = null
def grypeConfigPath = null
def trivyIgnorePath = null
def sarifEnabled = false
def sbomOutputDir = null
// Container fallback images for grype / trivy / syft. Resolved at afterEvaluate from the root
// securityScan extension when present, defaulting to the upstream tags. Override per project via
// `securityScan { toolImages.grype = '...' }`.
def grypeImage = 'anchore/grype:latest'
def trivyImage = 'aquasec/trivy:latest'
def syftImage  = 'anchore/syft:latest'

afterEvaluate {
    // Image name resolution. Monorepo: docker-conventions applies a deltafi-prefixed tag via
    // dockerTagDeltafi → scan deltafi/${name}:${version}. Otherwise (e.g. external plugin-
    // convention): use docker.name and depend on docker build.
    scanImageName = project.tasks.findByName('dockerTagDeltafi') != null
        ? "deltafi/${projectName}:${projectVersion}".toString()
        : project.docker.name.toString()

    // Suppressions + toolImages live under the root project's securityScan extension (when present).
    def ext = rootProject.extensions.findByName('securityScan')
    if (ext != null) {
        sarifEnabled = ext.sarif
        sbomOutputDir = ext.sbomDir ?: rootBuildDir.dir('sboms').get().asFile
        if (ext.suppressionsDir?.isDirectory()) {
            def grypeYaml = new File(ext.suppressionsDir, 'grype.yaml')
            if (grypeYaml.isFile()) grypeConfigPath = grypeYaml.absolutePath
            def trivyIgnore = new File(ext.suppressionsDir, 'trivyignore')
            if (trivyIgnore.isFile()) trivyIgnorePath = trivyIgnore.absolutePath
        }
        if (ext.toolImages?.grype) grypeImage = ext.toolImages.grype
        if (ext.toolImages?.trivy) trivyImage = ext.toolImages.trivy
        if (ext.toolImages?.syft)  syftImage  = ext.toolImages.syft
    } else {
        sbomOutputDir = rootBuildDir.dir('sboms').get().asFile
    }
}

task grype {
    group = 'security'
    description = "Scans this project's Docker image for vulnerabilities (grype)"

    // Always run, never cache - vulnerability databases update frequently
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'grype', grypeImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        def imageName = scanImageName
        // In container fallback mode, mount the grype config file so the grype container can read it.
        def grypePrefix = []
        if (grypeConfigPath != null) {
            runner.mount(grypeConfigPath, '/grype.yaml')
            grypePrefix = ['--config', runner.translatePath(grypeConfigPath)]
        }

        runner.runStreaming(["db", "update"])

        def jsonResult = runner.run(grypePrefix + [imageName, "--output", "json"])
        runner.runStreaming(grypePrefix + [imageName])

        if (sarifEnabled) {
            grypeSarifOutput.parentFile.mkdirs()
            // Mount the output directory so grype (in container mode) can write the SARIF file back to the host.
            runner.mount(grypeSarifOutput.parentFile.absolutePath, '/sarif-output')
            def sarifPath = runner.translatePath(grypeSarifOutput.absolutePath)
            runner.runStreaming(grypePrefix + [imageName, "--output", "sarif", "--file", sarifPath])
            println "Grype SARIF written to: ${grypeSarifOutput.absolutePath}"
        }

        if (jsonResult.stdout.length() > 0) {
            try {
                def json = new groovy.json.JsonSlurper().parseText(jsonResult.stdout)
                def matches = json.matches ?: []

                def severityCounts = [:]
                def fixableSeverityCounts = [:]
                def fixableCount = 0
                def findings = []

                matches.each { match ->
                    def severity = Severity.normalize(match.vulnerability?.severity)
                    severityCounts[severity] = (severityCounts[severity] ?: 0) + 1

                    def fixVersions = match.vulnerability?.fix?.versions
                    def fixed = fixVersions && !fixVersions.isEmpty()
                    if (fixed) {
                        fixableCount++
                        fixableSeverityCounts[severity] = (fixableSeverityCounts[severity] ?: 0) + 1
                    }
                    findings.add([
                        id: match.vulnerability?.id ?: "Unknown",
                        severity: severity,
                        package: match.artifact?.name ?: "Unknown",
                        version: match.artifact?.version ?: "Unknown",
                        fixVersion: fixed ? fixVersions[0] : null
                    ])
                }

                grypeJsonOutput.parentFile.mkdirs()

                def results = [
                    projectName: projectName,
                    imageName: imageName,
                    tool: 'grype',
                    totalVulnerabilities: matches.size(),
                    severityCounts: severityCounts,
                    fixableSeverityCounts: fixableSeverityCounts,
                    fixableCount: fixableCount,
                    findings: findings,
                    // Subset of findings that have a fix available — kept for the
                    // grypeReport/grypeFullReport aggregator tasks in root build.gradle.
                    fixableVulnerabilities: findings.findAll { it.fixVersion != null }
                ]

                grypeJsonOutput.text = new groovy.json.JsonBuilder(results).toPrettyString()

                def separator = "=================================================================================="
                println "\n" + separator
                println "GRYPE SCAN SUMMARY"
                println separator
                println "Image: ${imageName}"
                println "Total vulnerabilities found: ${matches.size()}"

                if (severityCounts.size() > 0) {
                    println "\nVulnerabilities by severity:"
                    Severity.DISPLAY_ORDER.each { severity ->
                        if (severityCounts.containsKey(severity)) {
                            println "  ${severity.padRight(12)}: ${severityCounts[severity]}"
                        }
                    }
                    severityCounts.each { severity, count ->
                        if (!Severity.DISPLAY_ORDER.contains(severity)) {
                            println "  ${severity.padRight(12)}: ${count}"
                        }
                    }
                }

                if (fixableCount > 0) {
                    println "\nFixable vulnerabilities: ${fixableCount}"
                }

                println separator + "\n"

            } catch (Exception e) {
                println "\nWarning: Could not parse grype JSON output for summary: ${e.message}"
            }
        }
    }
}

task trivy {
    group = 'security'
    description = "Scans this project's Docker image for vulnerabilities (trivy)"

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'trivy', trivyImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        def imageName = scanImageName
        // In container fallback mode, the host trivyignore path won't exist inside the trivy
        // container — mount it explicitly and pass the translated (container-side) path.
        def trivyIgnoreFlags = []
        if (trivyIgnorePath != null) {
            runner.mount(trivyIgnorePath, '/trivyignore')
            trivyIgnoreFlags = ['--ignorefile', runner.translatePath(trivyIgnorePath)]
        }

        def jsonResult = runner.run(["image"] + trivyIgnoreFlags + ["--format", "json", imageName])
        runner.runStreaming(["image"] + trivyIgnoreFlags + [imageName])

        if (sarifEnabled) {
            trivySarifOutput.parentFile.mkdirs()
            // Mount the output directory so trivy (in container mode) can write the SARIF file back to the host.
            runner.mount(trivySarifOutput.parentFile.absolutePath, '/sarif-output')
            def sarifPath = runner.translatePath(trivySarifOutput.absolutePath)
            runner.runStreaming(["image"] + trivyIgnoreFlags + ["--format", "sarif", "--output", sarifPath, imageName])
            println "Trivy SARIF written to: ${trivySarifOutput.absolutePath}"
        }

        if (jsonResult.stdout.length() > 0) {
            try {
                def json = new groovy.json.JsonSlurper().parseText(jsonResult.stdout)
                def vulnerabilities = []

                if (json.Results) {
                    json.Results.each { result ->
                        if (result.Vulnerabilities) {
                            vulnerabilities.addAll(result.Vulnerabilities)
                        }
                    }
                }

                def severityCounts = [:]
                def fixableSeverityCounts = [:]
                def fixableCount = 0
                def findings = []

                vulnerabilities.each { vuln ->
                    def severity = Severity.normalize(vuln.Severity)
                    severityCounts[severity] = (severityCounts[severity] ?: 0) + 1

                    def fixed = vuln.FixedVersion && vuln.FixedVersion != ""
                    if (fixed) {
                        fixableCount++
                        fixableSeverityCounts[severity] = (fixableSeverityCounts[severity] ?: 0) + 1
                    }
                    findings.add([
                        id: vuln.VulnerabilityID ?: "Unknown",
                        severity: severity,
                        package: vuln.PkgName ?: "Unknown",
                        version: vuln.InstalledVersion ?: "Unknown",
                        fixVersion: fixed ? vuln.FixedVersion : null
                    ])
                }

                trivyJsonOutput.parentFile.mkdirs()

                def results = [
                    projectName: projectName,
                    imageName: imageName,
                    tool: 'trivy',
                    totalVulnerabilities: vulnerabilities.size(),
                    severityCounts: severityCounts,
                    fixableSeverityCounts: fixableSeverityCounts,
                    fixableCount: fixableCount,
                    findings: findings,
                    // Subset of findings that have a fix available — kept for the
                    // trivyReport/trivyFullReport aggregator tasks in root build.gradle.
                    fixableVulnerabilities: findings.findAll { it.fixVersion != null }
                ]

                trivyJsonOutput.text = new groovy.json.JsonBuilder(results).toPrettyString()

                def separator = "=================================================================================="
                println "\n" + separator
                println "TRIVY SCAN SUMMARY"
                println separator
                println "Image: ${imageName}"
                println "Total vulnerabilities found: ${vulnerabilities.size()}"

                if (severityCounts.size() > 0) {
                    println "\nVulnerabilities by severity:"
                    Severity.DISPLAY_ORDER.each { severity ->
                        if (severityCounts.containsKey(severity)) {
                            println "  ${severity.padRight(12)}: ${severityCounts[severity]}"
                        }
                    }
                    severityCounts.each { severity, count ->
                        if (!Severity.DISPLAY_ORDER.contains(severity)) {
                            println "  ${severity.padRight(12)}: ${count}"
                        }
                    }
                }

                if (fixableCount > 0) {
                    println "\nFixable vulnerabilities: ${fixableCount}"
                }

                println separator + "\n"

            } catch (Exception e) {
                println "\nWarning: Could not parse trivy JSON output for summary: ${e.message}"
            }
        }
    }
}

task sbom {
    group = 'security'
    description = "Generates a CycloneDX SBOM for this project's Docker image (syft)"

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'syft', syftImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        sbomOutputDir.mkdirs()
        def outputFile = new File(sbomOutputDir, "${projectName}.cdx.json")

        // Mount the output directory so syft (in container mode) can write the SBOM back to the host.
        runner.mount(sbomOutputDir.absolutePath, '/sbom-output')
        def sbomPath = runner.translatePath(outputFile.absolutePath)

        runner.runStreaming(['scan', scanImageName, '-o', "cyclonedx-json=${sbomPath}"])
        println "\nSBOM written to: ${outputFile.absolutePath}"
    }
}

// Wire dependencies after evaluation so we can detect whichever image-producing task is configured.
afterEvaluate {
    def producer = tasks.findByName('dockerTagDeltafi') ?: tasks.findByName('docker')
    if (producer != null) {
        grype.dependsOn producer
        trivy.dependsOn producer
        sbom.dependsOn producer
    }
}
