// ABOUTME: Per-subproject scan + report tasks for a project's Docker image (grype, trivy, sbom).
// ABOUTME: Shared by the monorepo (via docker-conventions) and downstream plugins (via plugin-convention).
import org.deltafi.gradle.cli.ExecHelper
import org.deltafi.gradle.cli.ToolRunner
import org.deltafi.gradle.security.ReportRenderer
import org.deltafi.gradle.security.ScanExecutor
import org.deltafi.gradle.security.ScanResultParser

plugins {
    id 'org.deltafi.docker'
}

def securityScanExecHelper = objects.newInstance(ExecHelper)

// Config-time captures shared by all tasks. All references to project/rootProject must happen here
// (config time) — task doLast bodies are forbidden from touching them per Gradle 9's Task.project
// deprecation, since that breaks the configuration cache.
def projectName = project.name
def projectVersion = project.version
def projectBuildDir = project.layout.buildDirectory
def reportDir = projectBuildDir.dir('reports/security').get().asFile

def grypeJsonOutput  = new File(reportDir, 'grype.json')
def grypeMdOutput    = new File(reportDir, 'grype.md')
def grypeSarifOutput = new File(reportDir, 'grype.sarif')
def trivyJsonOutput  = new File(reportDir, 'trivy.json')
def trivyMdOutput    = new File(reportDir, 'trivy.md')
def trivySarifOutput = new File(reportDir, 'trivy.sarif')

// Walks up to find the securityScan extension wherever security-scan was applied (this project,
// an ancestor, or the root). Decouples per-image result location from the aggregator's location
// so the two plugins don't have to be applied at the same level of the project tree.
def findSecurityScanExtUpward = {
    def p = project
    while (p != null) {
        def ext = p.extensions.findByName('securityScan')
        if (ext != null) return ext
        p = p.parent
    }
    return null
}

// State that depends on docker { ... } config or the securityScan extension is resolved during
// afterEvaluate, then closed over by the task doLast bodies.
def scanImageName = null
def grypeConfigPath = null
def trivyIgnorePath = null
def sarifEnabled = false
def sbomOutputDir = null
def grypeImage = 'anchore/grype:latest'
def trivyImage = 'aquasec/trivy:latest'
def syftImage  = 'anchore/syft:latest'

afterEvaluate {
    // Image name resolution. Monorepo: docker-conventions applies a deltafi-prefixed tag via
    // dockerTagDeltafi → scan deltafi/${name}:${version}. Otherwise (e.g. external plugin-
    // convention): use docker.name and depend on docker build.
    scanImageName = project.tasks.findByName('dockerTagDeltafi') != null
        ? "deltafi/${projectName}:${projectVersion}".toString()
        : project.docker.name.toString()

    def ext = findSecurityScanExtUpward()
    if (ext != null) {
        sarifEnabled = ext.sarif
        sbomOutputDir = ext.sbomDir ?: projectBuildDir.dir('sboms').get().asFile
        if (ext.suppressionsDir?.isDirectory()) {
            def grypeYaml = new File(ext.suppressionsDir, 'grype.yaml')
            if (grypeYaml.isFile()) grypeConfigPath = grypeYaml.absolutePath
            def trivyIgnore = new File(ext.suppressionsDir, 'trivyignore')
            if (trivyIgnore.isFile()) trivyIgnorePath = trivyIgnore.absolutePath
        }
        if (ext.toolImages?.grype) grypeImage = ext.toolImages.grype
        if (ext.toolImages?.trivy) trivyImage = ext.toolImages.trivy
        if (ext.toolImages?.syft)  syftImage  = ext.toolImages.syft
    } else {
        sbomOutputDir = projectBuildDir.dir('sboms').get().asFile
    }
}

// ---------- ad-hoc streaming scan tasks (no artifacts) ----------

task grype {
    group = 'security'
    description = "Streams grype output for this project's Docker image"

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'grype', grypeImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        def grypePrefix = []
        if (grypeConfigPath != null) {
            runner.mount(grypeConfigPath, '/grype.yaml')
            grypePrefix = ['--config', runner.translatePath(grypeConfigPath)]
        }

        runner.runStreaming(grypePrefix + [scanImageName, '--quiet'])
    }
}

task trivy {
    group = 'security'
    description = "Streams trivy output for this project's Docker image"

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'trivy', trivyImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        def trivyIgnoreFlags = []
        if (trivyIgnorePath != null) {
            runner.mount(trivyIgnorePath, '/trivyignore')
            trivyIgnoreFlags = ['--ignorefile', runner.translatePath(trivyIgnorePath)]
        }

        runner.runStreaming(['--quiet', 'image', '--skip-db-update', '--skip-java-db-update'] + trivyIgnoreFlags + [scanImageName])
    }
}

// ---------- per-image *Report tasks (produce build/reports/security/{grype,trivy}.{json,md}) ----------

task grypeReport {
    group = 'security'
    description = "Generates grype.json and grype.md for this project's Docker image"
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'grype', grypeImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        def grypePrefix = []
        if (grypeConfigPath != null) {
            runner.mount(grypeConfigPath, '/grype.yaml')
            grypePrefix = ['--config', runner.translatePath(grypeConfigPath)]
        }

        def raw = ScanExecutor.runAndParseJson(runner,
            grypePrefix + [scanImageName, '--output', 'json'],
            path)
        def result = ScanResultParser.grypeImage(raw, projectName, scanImageName)

        reportDir.mkdirs()
        grypeJsonOutput.text = new groovy.json.JsonBuilder(result).toPrettyString()
        grypeMdOutput.text   = ReportRenderer.renderImageReport(result, ReportRenderer.isoNow())

        if (sarifEnabled) {
            grypeSarifOutput.parentFile.mkdirs()
            runner.mount(grypeSarifOutput.parentFile.absolutePath, '/sarif-output')
            runner.runStreaming(grypePrefix + [scanImageName, '--output', 'sarif', '--file', runner.translatePath(grypeSarifOutput.absolutePath)])
            println "Grype SARIF written to: ${grypeSarifOutput.absolutePath}"
        }

        println "grype: ${result.totalVulnerabilities} findings → ${grypeMdOutput.absolutePath}"
    }
}

task trivyReport {
    group = 'security'
    description = "Generates trivy.json and trivy.md for this project's Docker image"
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'trivy', trivyImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        def trivyIgnoreFlags = []
        if (trivyIgnorePath != null) {
            runner.mount(trivyIgnorePath, '/trivyignore')
            trivyIgnoreFlags = ['--ignorefile', runner.translatePath(trivyIgnorePath)]
        }

        def raw = ScanExecutor.runAndParseJson(runner,
            ['--quiet', 'image', '--skip-db-update', '--skip-java-db-update'] + trivyIgnoreFlags + ['--format', 'json', scanImageName],
            path)
        def result = ScanResultParser.trivyImage(raw, projectName, scanImageName)

        reportDir.mkdirs()
        trivyJsonOutput.text = new groovy.json.JsonBuilder(result).toPrettyString()
        trivyMdOutput.text   = ReportRenderer.renderImageReport(result, ReportRenderer.isoNow())

        if (sarifEnabled) {
            trivySarifOutput.parentFile.mkdirs()
            runner.mount(trivySarifOutput.parentFile.absolutePath, '/sarif-output')
            runner.runStreaming(['--quiet', 'image', '--skip-db-update', '--skip-java-db-update'] + trivyIgnoreFlags +
                ['--format', 'sarif', '--output', runner.translatePath(trivySarifOutput.absolutePath), scanImageName])
            println "Trivy SARIF written to: ${trivySarifOutput.absolutePath}"
        }

        println "trivy: ${result.totalVulnerabilities} findings → ${trivyMdOutput.absolutePath}"
    }
}

// ---------- sbom (unchanged behavior, just relocated dependency wiring) ----------

task sbom {
    group = 'security'
    description = "Generates a CycloneDX SBOM for this project's Docker image (syft)"

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(securityScanExecHelper.execOperations, 'syft', syftImage)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        sbomOutputDir.mkdirs()
        def outputFile = new File(sbomOutputDir, "${projectName}.cdx.json")

        runner.mount(sbomOutputDir.absolutePath, '/sbom-output')
        def sbomPath = runner.translatePath(outputFile.absolutePath)

        runner.runStreaming(['scan', scanImageName, '-o', "cyclonedx-json=${sbomPath}"])
        println "\nSBOM written to: ${outputFile.absolutePath}"
    }
}

// Wire dependencies after evaluation so we can detect whichever image-producing task is configured.
afterEvaluate {
    def producer = tasks.findByName('dockerTagDeltafi') ?: tasks.findByName('docker')
    if (producer != null) {
        grype.dependsOn producer
        trivy.dependsOn producer
        grypeReport.dependsOn producer
        trivyReport.dependsOn producer
        sbom.dependsOn producer
    }
}
