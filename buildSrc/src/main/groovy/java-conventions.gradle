plugins {
    id 'license-conventions'
    id 'java-library'
    id 'jacoco'
    id 'test-summary-conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

configurations.all {
    resolutionStrategy {
        dependencySubstitution {
            // CVE-2026-0636: force bouncycastle past the 1.81 pulled transitively by io.minio:minio.
            // bcpkix is kept locked to the same BouncyCastle release as bcprov.
            substitute module('org.bouncycastle:bcprov-jdk18on') using module("org.bouncycastle:bcprov-jdk18on:${bouncyCastleVersion}") because 'CVE-2026-0636'
            substitute module('org.bouncycastle:bcpkix-jdk18on') using module("org.bouncycastle:bcpkix-jdk18on:${bouncyCastleVersion}") because 'CVE-2026-0636'
            // CVE-2026-8149: pin the FIPS/LTS bouncycastle pulled transitively by io.nats:jnats
            substitute module('org.bouncycastle:bcprov-lts8on') using module("org.bouncycastle:bcprov-lts8on:${bouncyCastleLtsVersion}") because 'CVE-2026-8149'
            // CVE-2026-54515: pin the Jackson 2.x databind pulled transitively by io.minio:minio and dgs-codegen
            substitute module('com.fasterxml.jackson.core:jackson-databind') using module("com.fasterxml.jackson.core:jackson-databind:${jackson2Version}") because 'CVE-2026-54515'
        }
    }
}

tasks.register('allDeps', DependencyReportTask)

javadoc {
    exclude '**/generated/**'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.tags = [
            'apiNote:a:API Note:',
            'implSpec:a:Implementation Requirements:',
            'implNote:a:Implementation Note:'
    ]
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters' << '-Xlint:deprecation' << '-Xlint:unchecked'
}

compileTestJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters' << '-Xlint:deprecation' << '-Xlint:unchecked'
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    jvmArgs("-XX:+EnableDynamicAgentLoading")
}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/generated/**', '**/*Application.class'])
        }))
    }
}
