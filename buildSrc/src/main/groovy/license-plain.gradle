plugins {
    id 'license-conventions'
}

task licenseLocal(type: org.deltafi.gradle.license.LicenseCheckTask) {
    source = fileTree(dir: ".").exclude("build")
}
tasks.license.dependsOn licenseLocal

task licenseFormatLocal(type: org.deltafi.gradle.license.LicenseFormatTask) {
    source = fileTree(dir: ".").exclude("build")
}
tasks.licenseFormat.dependsOn licenseFormatLocal
