// ABOUTME: Registers root *Report tasks (security/grype/trivy/source/config/secrets), *Gate tasks, and DB warmups.
// ABOUTME: Reports never gate on findings; gates evaluate JSON the reports already produced.
import org.deltafi.gradle.cli.ExecHelper
import org.deltafi.gradle.cli.ToolRunner
import org.deltafi.gradle.security.ReportRenderer
import org.deltafi.gradle.security.ScanExecutor
import org.deltafi.gradle.security.ScanResultParser
import org.deltafi.gradle.security.SecurityScanExtension
import org.deltafi.gradle.security.SeverityGate
import org.deltafi.gradle.security.Severity

def securityScanExt = extensions.create('securityScan', SecurityScanExtension, project)

def aggregatorExecHelper = objects.newInstance(ExecHelper)

/**
 * Build-scoped service whose only job is to serialise trivy invocations. Trivy contends on its
 * own boltdb cache files when multiple scans run concurrently — even after a shared DB warmup
 * — which manifests as silently-empty JSON output for the losers. maxParallelUsages = 1 forces
 * Gradle to run at most one trivy-bearing task at a time across the whole build.
 */
abstract class TrivyDbAccessService implements org.gradle.api.services.BuildService<org.gradle.api.services.BuildServiceParameters.None> {}

def trivyDbAccessService = gradle.sharedServices.registerIfAbsent('trivyDbAccess', TrivyDbAccessService) {
    maxParallelUsages = 1
}
project.ext.trivyDbAccessService = trivyDbAccessService

// ---------- DB warmups (single per-build refresh; all subsequent scans skip in-tool updates) ----------

task trivyDbWarmup {
    group = 'security'
    description = 'Downloads/updates the trivy vulnerability databases once before any trivy task runs'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    usesService trivyDbAccessService

    doLast {
        def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'trivy', securityScanExt.toolImages.trivy)
        runner.ensureAvailable()
        runner.announceFallbackOnce()
        runner.runStreaming(['--quiet', 'image', '--download-db-only'])
        runner.runStreaming(['--quiet', 'image', '--download-java-db-only'])
    }
}

task grypeDbWarmup {
    group = 'security'
    description = 'Downloads/updates the grype vulnerability database once before any grype task runs'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'grype', securityScanExt.toolImages.grype)
        runner.ensureAvailable()
        runner.announceFallbackOnce()
        runner.runStreaming(['db', 'update', '--quiet'])
    }
}

// ---------- config-time path captures (avoid Gradle 9's Task.project execution-time deprecation) ----------

def reportDir = project.layout.buildDirectory.dir('reports/security').get().asFile

// Per-subproject artifact paths (each subproject's docker-scan writes here).
def perSubprojectGrypeFiles = allprojects.collect { new File(it.layout.buildDirectory.get().asFile, 'reports/security/grype.json') }
def perSubprojectTrivyFiles = allprojects.collect { new File(it.layout.buildDirectory.get().asFile, 'reports/security/trivy.json') }

def grypeJsonOutput   = new File(reportDir, 'grype.json')
def grypeMdOutput     = new File(reportDir, 'grype.md')
def trivyJsonOutput   = new File(reportDir, 'trivy.json')
def trivyMdOutput     = new File(reportDir, 'trivy.md')
def sourceJsonOutput  = new File(reportDir, 'source.json')
def sourceMdOutput    = new File(reportDir, 'source.md')
def configJsonOutput  = new File(reportDir, 'config.json')
def configMdOutput    = new File(reportDir, 'config.md')
def secretsJsonOutput = new File(reportDir, 'secrets.json')
def secretsMdOutput   = new File(reportDir, 'secrets.md')
def securityMdOutput  = new File(reportDir, 'security.md')
def referencedDir     = new File(reportDir, 'referenced')

def failOnOverrideProvider = providers.gradleProperty('failOn')
def rootDir = project.rootDir

// ---------- repo-wide *Report tasks ----------

task securitySourceReport {
    group = 'security'
    description = 'Generates source.json and source.md from trivy fs (dependency scan)'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    usesService trivyDbAccessService

    doLast {
        def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'trivy', securityScanExt.toolImages.trivy)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        runner.mount(securityScanExt.sourcePath.absolutePath, '/scan-target')
        def target = runner.translatePath(securityScanExt.sourcePath.absolutePath)

        def ignoreFlags = []
        if (securityScanExt.suppressionsDir?.isDirectory()) {
            def f = new File(securityScanExt.suppressionsDir, 'trivyignore')
            if (f.isFile()) {
                runner.mount(f.absolutePath, '/trivyignore')
                ignoreFlags = ['--ignorefile', runner.translatePath(f.absolutePath)]
            }
        }

        def args = ['--quiet', 'fs', '--skip-db-update', '--skip-java-db-update',
                    '--skip-dirs', securityScanExt.skipDirs.join(','),
                    '--format', 'json'] + ignoreFlags + [target]
        def raw = ScanExecutor.runAndParseJson(runner, args, path) as Map
        def result = ScanResultParser.trivyRepo('source', raw)

        reportDir.mkdirs()
        sourceJsonOutput.text = new groovy.json.JsonBuilder(result).toPrettyString()
        sourceMdOutput.text   = ReportRenderer.renderRepoScanReport(result, ReportRenderer.isoNow())
        println "trivy fs: ${result.totalVulnerabilities} findings → ${sourceMdOutput.absolutePath}"
    }
}

task securitySecretsReport {
    group = 'security'
    description = 'Generates secrets.json and secrets.md from trivy secret scan'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    usesService trivyDbAccessService

    doLast {
        def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'trivy', securityScanExt.toolImages.trivy)
        runner.ensureAvailable()
        runner.announceFallbackOnce()

        runner.mount(securityScanExt.secretsPath.absolutePath, '/scan-target')
        def target = runner.translatePath(securityScanExt.secretsPath.absolutePath)

        def args = ['--quiet', 'fs', '--skip-db-update', '--skip-java-db-update',
                    '--scanners', 'secret',
                    '--skip-dirs', securityScanExt.skipDirs.join(','),
                    '--format', 'json', target]
        def raw = ScanExecutor.runAndParseJson(runner, args, path) as Map

        def severityCounts = [:]
        def findings = []
        int total = 0
        raw.Results?.each { r ->
            r.Secrets?.each { Map s ->
                def sev = Severity.normalize(s.Severity)
                severityCounts[sev] = (severityCounts[sev] ?: 0) + 1
                findings.add([
                    id      : s.RuleID ?: 'Unknown',
                    severity: sev,
                    title   : s.Title ?: '',
                    file    : r.Target ?: '',
                    line    : s.StartLine
                ])
                total++
            }
        }
        def result = [
            projectName          : 'secrets',
            imageName            : '',
            tool                 : 'trivy-secrets',
            totalVulnerabilities : total,
            severityCounts       : severityCounts,
            fixableSeverityCounts: severityCounts.collectEntries { k, v -> [(k): v] },
            fixableCount         : total,
            findings             : findings
        ]

        reportDir.mkdirs()
        secretsJsonOutput.text = new groovy.json.JsonBuilder(result).toPrettyString()
        secretsMdOutput.text   = ReportRenderer.renderRepoScanReport(result, ReportRenderer.isoNow())
        println "trivy secrets: ${result.totalVulnerabilities} findings → ${secretsMdOutput.absolutePath}"
    }
}

task securityConfigReport {
    group = 'security'
    description = 'Generates config.json and config.md from Checkov misconfig scan'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'checkov', securityScanExt.toolImages.checkov, false)
        runner.ensureAvailable()
        runner.announceFallbackOnce()
        runner.env('LOG_LEVEL', 'ERROR')

        def directoryFlags = []
        securityScanExt.configPaths.eachWithIndex { File p, int i ->
            runner.mount(p.absolutePath, "/scan${i}".toString())
            directoryFlags += ['-d', runner.translatePath(p.absolutePath)]
        }

        def configFileFlags = []
        if (securityScanExt.suppressionsDir?.isDirectory()) {
            def cfg = new File(securityScanExt.suppressionsDir, 'checkov.yaml')
            if (cfg.isFile()) {
                runner.mount(cfg.absolutePath, '/checkov.yaml')
                configFileFlags = ['--config-file', runner.translatePath(cfg.absolutePath)]
            }
        }
        def skipPathFlags = securityScanExt.configSkipPaths.collectMany { ['--skip-path', it] }

        def args = directoryFlags + configFileFlags + skipPathFlags + ['-o', 'json', '--soft-fail', '--quiet']
        def raw = ScanExecutor.runAndParseJson(runner, args, path)
        def frameworkResults = raw instanceof List ? raw : [raw]

        def severityCounts = [:]
        def findings = []
        int total = 0
        frameworkResults.each { fw ->
            fw?.results?.failed_checks?.each { Map ck ->
                def rawSeverity = ck.severity
                String s
                if (rawSeverity == null || rawSeverity == '') s = Severity.MEDIUM
                else if (rawSeverity == 'INFO') s = Severity.NEGLIGIBLE
                else s = Severity.normalize(rawSeverity)
                severityCounts[s] = (severityCounts[s] ?: 0) + 1
                findings.add([
                    id      : ck.check_id ?: 'Unknown',
                    severity: s,
                    title   : ck.check_name ?: '',
                    file    : ck.file_path ?: '',
                    line    : ck.file_line_range ? ck.file_line_range[0] : null,
                    resource: ck.resource ?: ''
                ])
                total++
            }
        }
        def result = [
            projectName          : 'config',
            imageName            : '',
            tool                 : 'checkov',
            totalVulnerabilities : total,
            severityCounts       : severityCounts,
            fixableSeverityCounts: severityCounts.collectEntries { k, v -> [(k): v] },
            fixableCount         : total,
            findings             : findings
        ]

        reportDir.mkdirs()
        configJsonOutput.text = new groovy.json.JsonBuilder(result).toPrettyString()
        configMdOutput.text   = ReportRenderer.renderRepoScanReport(result, ReportRenderer.isoNow())
        println "checkov: ${result.totalVulnerabilities} findings → ${configMdOutput.absolutePath}"
    }
}

// ---------- root grypeReport / trivyReport (aggregate per-subproject + scan referencedImages) ----------

// In the downstream plugin case (root applies plugin-convention → docker-scan + security-scan),
// docker-scan has already registered grypeReport/trivyReport on the same project. Skip the
// aggregator definition there — the per-image task is the only one needed, and `securityReport`
// + gates handle both the single-record and aggregated JSON schemas.
if (tasks.findByName('grypeReport') == null) {
task grypeReport {
    group = 'security'
    description = 'Aggregates per-image grype reports and scans referencedImages; emits grype.json + grype.md'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def slurp = new groovy.json.JsonSlurper()
        def imageRecords = perSubprojectGrypeFiles.findAll { it.isFile() }
            .collect { slurp.parseText(it.text) as Map }
            .findAll { it.containsKey('projectName') && it.containsKey('imageName') && !it.containsKey('images') }

        if (securityScanExt.referencedImages) {
            referencedDir.mkdirs()
            def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'grype', securityScanExt.toolImages.grype)
            runner.ensureAvailable()
            runner.announceFallbackOnce()
            def sarifEnabled = securityScanExt.sarif
            if (sarifEnabled) runner.mount(referencedDir.absolutePath, '/sarif-output')
            securityScanExt.referencedImages.each { String image ->
                aggregatorExecHelper.execOperations.exec {
                    it.ignoreExitValue = true
                    it.executable = 'docker'
                    it.args = ['pull', '--quiet', image]
                    it.standardOutput = new ByteArrayOutputStream()
                    it.errorOutput = new ByteArrayOutputStream()
                }
                def sanitized = image.replaceAll('[/:]', '_')
                def raw = ScanExecutor.runAndParseJson(runner, [image, '--output', 'json'], "${path} [${image}]") as Map
                def record = ScanResultParser.grypeImage(raw, sanitized, image, true)
                new File(referencedDir, "${sanitized}.grype.json").text = new groovy.json.JsonBuilder(record).toPrettyString()
                new File(referencedDir, "${sanitized}.grype.md").text   = ReportRenderer.renderImageReport(record, ReportRenderer.isoNow())
                if (sarifEnabled) {
                    def sarifFile = new File(referencedDir, "${sanitized}.grype.sarif")
                    runner.runStreaming([image, '--output', 'sarif', '--file', runner.translatePath(sarifFile.absolutePath)])
                }
                imageRecords << record
            }
        }

        def threshold = failOnOverrideProvider.orNull ?: securityScanExt.failOn.grypeImage
        def gateRecords = imageRecords.collect { Map r ->
            def g = SeverityGate.evaluate(r, threshold, securityScanExt.ignoreUnfixed)
            [projectName: r.projectName, tool: r.tool, threshold: g.threshold, tripped: g.tripped, blockingCounts: g.blockingCounts]
        }

        reportDir.mkdirs()
        grypeJsonOutput.text = new groovy.json.JsonBuilder([generatedAt: ReportRenderer.isoNow(), images: imageRecords]).toPrettyString()
        grypeMdOutput.text   = ReportRenderer.renderAggregatedImageReport('Grype', imageRecords, gateRecords, ReportRenderer.isoNow())
        println "grype: ${imageRecords.size()} image(s) → ${grypeMdOutput.absolutePath}"
    }
}
}

if (tasks.findByName('trivyReport') == null) {
task trivyReport {
    group = 'security'
    description = 'Aggregates per-image trivy reports and scans referencedImages; emits trivy.json + trivy.md'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    usesService trivyDbAccessService

    doLast {
        def slurp = new groovy.json.JsonSlurper()
        def imageRecords = perSubprojectTrivyFiles.findAll { it.isFile() }
            .collect { slurp.parseText(it.text) as Map }
            .findAll { it.containsKey('projectName') && it.containsKey('imageName') && !it.containsKey('images') }

        if (securityScanExt.referencedImages) {
            referencedDir.mkdirs()
            def runner = new ToolRunner(aggregatorExecHelper.execOperations, 'trivy', securityScanExt.toolImages.trivy)
            runner.ensureAvailable()
            runner.announceFallbackOnce()
            def ignoreFlags = []
            if (securityScanExt.suppressionsDir?.isDirectory()) {
                def f = new File(securityScanExt.suppressionsDir, 'trivyignore')
                if (f.isFile()) {
                    runner.mount(f.absolutePath, '/trivyignore')
                    ignoreFlags = ['--ignorefile', runner.translatePath(f.absolutePath)]
                }
            }
            def sarifEnabled = securityScanExt.sarif
            if (sarifEnabled) runner.mount(referencedDir.absolutePath, '/sarif-output')
            securityScanExt.referencedImages.each { String image ->
                aggregatorExecHelper.execOperations.exec {
                    it.ignoreExitValue = true
                    it.executable = 'docker'
                    it.args = ['pull', '--quiet', image]
                    it.standardOutput = new ByteArrayOutputStream()
                    it.errorOutput = new ByteArrayOutputStream()
                }
                def sanitized = image.replaceAll('[/:]', '_')
                def raw = ScanExecutor.runAndParseJson(runner,
                    ['--quiet', 'image', '--skip-db-update', '--skip-java-db-update'] + ignoreFlags + ['--format', 'json', image],
                    "${path} [${image}]") as Map
                def record = ScanResultParser.trivyImage(raw, sanitized, image, true)
                new File(referencedDir, "${sanitized}.trivy.json").text = new groovy.json.JsonBuilder(record).toPrettyString()
                new File(referencedDir, "${sanitized}.trivy.md").text   = ReportRenderer.renderImageReport(record, ReportRenderer.isoNow())
                if (sarifEnabled) {
                    def sarifFile = new File(referencedDir, "${sanitized}.trivy.sarif")
                    runner.runStreaming(['--quiet', 'image', '--skip-db-update', '--skip-java-db-update'] + ignoreFlags +
                        ['--format', 'sarif', '--output', runner.translatePath(sarifFile.absolutePath), image])
                }
                imageRecords << record
            }
        }

        def threshold = failOnOverrideProvider.orNull ?: securityScanExt.failOn.trivyImage
        def gateRecords = imageRecords.collect { Map r ->
            def g = SeverityGate.evaluate(r, threshold, securityScanExt.ignoreUnfixed)
            [projectName: r.projectName, tool: r.tool, threshold: g.threshold, tripped: g.tripped, blockingCounts: g.blockingCounts]
        }

        reportDir.mkdirs()
        trivyJsonOutput.text = new groovy.json.JsonBuilder([generatedAt: ReportRenderer.isoNow(), images: imageRecords]).toPrettyString()
        trivyMdOutput.text   = ReportRenderer.renderAggregatedImageReport('Trivy', imageRecords, gateRecords, ReportRenderer.isoNow())
        println "trivy: ${imageRecords.size()} image(s) → ${trivyMdOutput.absolutePath}"
    }
}
}

// ---------- top-level securityReport (consolidator, no gating) ----------

task securityReport {
    group = 'security'
    description = 'Stitches grype/trivy/source/config/secrets reports into security.md (no gating)'
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    doLast {
        def slurp = new groovy.json.JsonSlurper()
        def summaries = []
        def embedded = [:]

        def summarizeImages = { String toolDisplay, String scope, File jsonFile, File mdFile, String thresholdKey ->
            if (!jsonFile.isFile()) return
            def threshold = failOnOverrideProvider.orNull ?: securityScanExt.failOn."${thresholdKey}"
            def parsed = slurp.parseText(jsonFile.text)
            def rawRecords = (parsed instanceof Map && parsed.images instanceof List) ? parsed.images : [parsed]
            def records = ReportRenderer.groupedImages(rawRecords as List<Map>)
            def rows = records.collect { Map r ->
                def g = SeverityGate.evaluate(r, threshold, securityScanExt.ignoreUnfixed)
                def label = (r.containsKey('referenced') && r.referenced) ?
                    "${r.imageName} (referenced)" : (r.imageName ?: r.projectName)
                [label  : label,
                 threshold: threshold,
                 total  : r.totalVulnerabilities ?: 0,
                 blocking: (g.blockingCounts.values().sum() ?: 0) as int,
                 tripped: g.tripped]
            }
            summaries << [tool: toolDisplay, scope: scope, rows: rows]
            embedded["${toolDisplay} (${scope})".toString()] = mdFile.isFile() ? mdFile.text : '_No report._'
        }

        def summarizeRepo = { String toolDisplay, String scope, String label, File jsonFile, File mdFile, String thresholdKey ->
            if (!jsonFile.isFile()) return
            def threshold = failOnOverrideProvider.orNull ?: securityScanExt.failOn."${thresholdKey}"
            def parsed = slurp.parseText(jsonFile.text) as Map
            def g = SeverityGate.evaluate(parsed, threshold, securityScanExt.ignoreUnfixed)
            summaries << [
                tool : toolDisplay, scope: scope,
                rows : [[label: label, threshold: threshold,
                         total: parsed.totalVulnerabilities ?: 0,
                         blocking: (g.blockingCounts.values().sum() ?: 0) as int,
                         tripped: g.tripped]]
            ]
            embedded["${toolDisplay} (${scope})".toString()] = mdFile.isFile() ? mdFile.text : '_No report._'
        }

        // Repo-wide scope labels are derived from the configured paths so they stay accurate
        // when users override sourcePath/secretsPath/configPaths.
        def relativize = { File f -> rootDir.toPath().relativize(f.toPath()).toString() ?: '.' }
        def sourceLabel  = relativize(securityScanExt.sourcePath)
        def secretsLabel = relativize(securityScanExt.secretsPath)
        def configLabel  = securityScanExt.configPaths.collect(relativize).join(', ')

        summarizeImages('Grype',   'images',  grypeJsonOutput,   grypeMdOutput,   'grypeImage')
        summarizeImages('Trivy',   'images',  trivyJsonOutput,   trivyMdOutput,   'trivyImage')
        summarizeRepo  ('Trivy',   'source',  sourceLabel,  sourceJsonOutput,  sourceMdOutput,  'trivyFs')
        summarizeRepo  ('Checkov', 'config',  configLabel,  configJsonOutput,  configMdOutput,  'checkov')
        summarizeRepo  ('Trivy',   'secrets', secretsLabel, secretsJsonOutput, secretsMdOutput, 'trivySecret')

        reportDir.mkdirs()
        securityMdOutput.text = ReportRenderer.renderConsolidatedReport(summaries, embedded, ReportRenderer.isoNow())
        println "Security report: ${securityMdOutput.absolutePath}"
    }
}

// ---------- gate tasks ----------

def evaluateGate = { String thresholdKey, List<Map> records ->
    def threshold = failOnOverrideProvider.orNull ?: securityScanExt.failOn."${thresholdKey}"
    def tripped = []
    records.each { Map r ->
        def g = SeverityGate.evaluate(r, threshold, securityScanExt.ignoreUnfixed)
        if (g.tripped) {
            tripped << "${r.tool}/${r.imageName ?: r.projectName}: ${g.blockingCounts}"
        }
    }
    if (!tripped.isEmpty()) {
        throw new GradleException("Gate tripped (threshold=${threshold}):\n  - ${tripped.join('\n  - ')}")
    }
}

// Accepts both schemas: aggregated `{generatedAt, images: [...]}` from the root aggregator,
// or a single per-image record from docker-scan's grypeReport in the downstream-plugin case.
def imageRecordsFrom = { Object parsed ->
    (parsed instanceof Map && parsed.images instanceof List) ? parsed.images : [parsed]
}

task grypeGate {
    group = 'security'
    description = 'Fails the build if any grype image scan exceeds the threshold'
    dependsOn tasks.named('grypeReport')
    doLast {
        def parsed = new groovy.json.JsonSlurper().parseText(grypeJsonOutput.text)
        evaluateGate('grypeImage', imageRecordsFrom(parsed) as List<Map>)
    }
}

task trivyGate {
    group = 'security'
    description = 'Fails the build if any trivy image scan exceeds the threshold'
    dependsOn tasks.named('trivyReport')
    doLast {
        def parsed = new groovy.json.JsonSlurper().parseText(trivyJsonOutput.text)
        evaluateGate('trivyImage', imageRecordsFrom(parsed) as List<Map>)
    }
}

task securitySourceGate {
    group = 'security'
    description = 'Fails the build if trivy fs findings exceed the threshold'
    dependsOn tasks.named('securitySourceReport')
    doLast {
        evaluateGate('trivyFs', [new groovy.json.JsonSlurper().parseText(sourceJsonOutput.text) as Map])
    }
}

task securityConfigGate {
    group = 'security'
    description = 'Fails the build if Checkov findings exceed the threshold'
    dependsOn tasks.named('securityConfigReport')
    doLast {
        evaluateGate('checkov', [new groovy.json.JsonSlurper().parseText(configJsonOutput.text) as Map])
    }
}

task securitySecretsGate {
    group = 'security'
    description = 'Fails the build if trivy secret findings exceed the threshold'
    dependsOn tasks.named('securitySecretsReport')
    doLast {
        evaluateGate('trivySecret', [new groovy.json.JsonSlurper().parseText(secretsJsonOutput.text) as Map])
    }
}

task securityGate {
    group = 'security'
    description = 'Aggregate gate: fails the build if any sub-gate fails'
    dependsOn tasks.named('grypeGate'),
              tasks.named('trivyGate'),
              tasks.named('securitySourceGate'),
              tasks.named('securityConfigGate'),
              tasks.named('securitySecretsGate')
}

// ---------- task wiring ----------

// Repo-wide trivy tasks depend on the trivy DB warmup.
tasks.named('securitySourceReport').configure  { dependsOn tasks.named('trivyDbWarmup') }
tasks.named('securitySecretsReport').configure { dependsOn tasks.named('trivyDbWarmup') }
tasks.named('trivyReport').configure           { dependsOn tasks.named('trivyDbWarmup') }
tasks.named('grypeReport').configure           { dependsOn tasks.named('grypeDbWarmup') }
tasks.named('securityReport').configure {
    dependsOn tasks.named('grypeReport'),
              tasks.named('trivyReport'),
              tasks.named('securitySourceReport'),
              tasks.named('securityConfigReport'),
              tasks.named('securitySecretsReport')
}

// Auto-discover per-subproject grype/trivy/grypeReport/trivyReport tasks (registered by docker-scan)
// and wire them into the root reports + DB warmups + trivy serialisation service.
//
// `allprojects` iterates the applying project plus every subproject — this is intentional, because
// the same code path serves two contexts:
//   - Monorepo: applied at root; subprojects (deltafi-core, etc.) carry the per-image tasks.
//   - Downstream plugin: applied at root; the root project itself carries the per-image tasks.
def aggregatorProject = project
allprojects { ap ->
    ap.afterEvaluate {
        def grypeReportTask = ap.tasks.findByName('grypeReport')
        if (grypeReportTask != null && ap != aggregatorProject) {
            aggregatorProject.tasks.named('grypeReport').configure { dependsOn grypeReportTask }
            grypeReportTask.dependsOn aggregatorProject.tasks.named('grypeDbWarmup')
        }
        def trivyReportTask = ap.tasks.findByName('trivyReport')
        if (trivyReportTask != null && ap != aggregatorProject) {
            aggregatorProject.tasks.named('trivyReport').configure { dependsOn trivyReportTask }
            trivyReportTask.dependsOn aggregatorProject.tasks.named('trivyDbWarmup')
            trivyReportTask.usesService trivyDbAccessService
        }
        def grypeTask = ap.tasks.findByName('grype')
        if (grypeTask != null) {
            grypeTask.dependsOn aggregatorProject.tasks.named('grypeDbWarmup')
        }
        def trivyTask = ap.tasks.findByName('trivy')
        if (trivyTask != null) {
            trivyTask.dependsOn aggregatorProject.tasks.named('trivyDbWarmup')
            trivyTask.usesService trivyDbAccessService
        }
    }
}
