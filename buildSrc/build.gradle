plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
}

gradlePlugin {
    plugins {
        dockerPlugin {
            id = 'org.deltafi.docker'
            implementationClass = 'org.deltafi.gradle.docker.DockerPlugin'
        }
        licensePlugin {
            id = 'org.deltafi.license'
            implementationClass = 'org.deltafi.gradle.license.LicensePlugin'
        }
    }
}
