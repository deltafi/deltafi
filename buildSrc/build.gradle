plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
}

gradlePlugin {
    plugins {
        dockerPlugin {
            id = 'org.deltafi.docker'
            implementationClass = 'org.deltafi.gradle.docker.DockerPlugin'
        }
        licensePlugin {
            id = 'org.deltafi.license'
            implementationClass = 'org.deltafi.gradle.license.LicensePlugin'
        }
    }
}

dependencies {
    testImplementation 'org.spockframework:spock-core:2.4-M6-groovy-4.0'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}
