.docs:
  variables:
    PROJECT_NAME: deltafi-docs

.when-docs-changes:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/dev
        paths:
          - deltafi-docs/**/*

"🐳 Publish docs (GitLab)":
  variables:
    CONTEXT: "${CI_PROJECT_DIR}"
    DOCKERFILE: "${CI_PROJECT_DIR}/${PROJECT_NAME}/Dockerfile"
  extends:
    - .docs
    - .docker
    - .when-docs-changes
  needs: []

"🐳 Publish docs (docker.io)":
  variables:
    CONTEXT: "${CI_PROJECT_DIR}"
    DOCKERFILE: "${CI_PROJECT_DIR}/${PROJECT_NAME}/Dockerfile"
  extends:
    - .docs
    - .docker-multiarch
  needs: []
