plugins {
    id 'docker-java'
    id 'org.springframework.boot' version "${springBootVersion}"
}

description = 'DeltaFi Artemis-ActiveMQ Ingress'

configurations {
    docs

    all {
        resolutionStrategy {
            dependencySubstitution {
                // substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk18on:1.84') because 'CVE'
            }
        }
    }
}

dependencies {
    implementation project(':deltafi-common')
    implementation project(':deltafi-common-spring')
    implementation project(':deltafi-ingress')

    implementation 'org.springframework.boot:spring-boot-starter-artemis'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.apache.activemq:artemis-jakarta-server'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()
}

jar {
    // do not create the -plain.jar
    enabled = false
}

dockerPrepare {
    from bootJar, 'probe.sh'
}

