plugins {
    id 'groovy-gradle-plugin'
    id 'java-conventions'
    id 'com.gradle.plugin-publish' version '2.1.1'
}

description = 'DeltaFi gradle plugin'

license {
    exclude("OrgDeltafiPluginConventionPlugin.java")
    exclude("OrgDeltafiTestSummaryPlugin.java")
    exclude("OrgDeltafiGitVersionPlugin.java")
    exclude("OrgDeltafiLicenseConventionPlugin.java")
}

javadoc {
    source = sourceSets.main.allJava.matching {
        exclude 'OrgDeltafiPluginConventionPlugin.java'
        exclude 'OrgDeltafiTestSummaryPlugin.java'
        exclude 'OrgDeltafiGitVersionPlugin.java'
        exclude 'OrgDeltafiLicenseConventionPlugin.java'
    }
}

dependencies {
    implementation project(':deltafi-common')
    implementation project(':deltafi-common-spring')

    implementation "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"

    implementation "org.yaml:snakeyaml:2.3"
}

group = 'org.deltafi.gradle-plugin'

gradlePlugin {
    website = 'https://deltafi.org'
    vcsUrl = 'https://github.com/deltafi-org/deltafi'

    plugins {
        pluginPlugin {
            id = 'org.deltafi.plugin'
            implementationClass = 'org.deltafi.gradle.plugin.PluginPlugin'
            displayName = 'Deltafi Plugin Tasks'
            description = 'Tasks used to build DeltaFi plugins'
            tags.set(['deltafi', 'DeltaFi', 'normalization'])
        }
        dockerPlugin {
            id = 'org.deltafi.docker'
            implementationClass = 'org.deltafi.gradle.docker.DockerPlugin'
            displayName = 'DeltaFi Docker Tasks'
            description = 'Tasks used to build Docker images for DeltaFi projects'
            tags.set(['deltafi', 'DeltaFi', 'docker'])
        }
        licensePlugin {
            id = 'org.deltafi.license'
            implementationClass = 'org.deltafi.gradle.license.LicensePlugin'
            displayName = 'DeltaFi License Tasks'
            description = 'Inserts and verifies the project license header on source files'
            tags.set(['deltafi', 'DeltaFi', 'license'])
        }
    }
}

pluginDescriptors {
    afterEvaluate {
        declarations.get().each { PluginDeclaration declaration ->
            if (declaration.getId() == "org.deltafi.plugin-convention") {
                declaration.setDisplayName("DeltaFi Plugin Convention")
                declaration.setDescription("Convention used for a DeltaFi plugin")
                declaration.getTags().set(['deltafi', 'DeltaFi', 'normalization'])
            }
            if (declaration.getId() == "org.deltafi.test-summary") {
                declaration.setDisplayName("DeltaFi Test Summary")
                declaration.setDescription("Pretty-prints a boxed summary of test results across all subprojects after the build finishes")
                declaration.getTags().set(['deltafi', 'DeltaFi', 'testing'])
            }
            if (declaration.getId() == "org.deltafi.git-version") {
                declaration.setDisplayName("DeltaFi Git Version")
                declaration.setDescription("Derives the project version from the latest git tag (`git describe --tags`)")
                declaration.getTags().set(['deltafi', 'DeltaFi', 'versioning'])
            }
            if (declaration.getId() == "org.deltafi.license-convention") {
                declaration.setDisplayName("DeltaFi License Convention")
                declaration.setDescription("Applies the DeltaFi license header conventions (mappings, excludes, strict check) to a project")
                declaration.getTags().set(['deltafi', 'DeltaFi', 'license'])
            }
            if (declaration.getId() == "org.deltafi.docker-scan") {
                declaration.setDisplayName("DeltaFi Docker Security Scan Tasks")
                declaration.setDescription("Adds 'grype' and 'trivy' tasks that scan the project's Docker image for vulnerabilities")
                declaration.getTags().set(['deltafi', 'DeltaFi', 'security'])
            }
            if (declaration.getId() == "org.deltafi.security-scan") {
                declaration.setDisplayName("DeltaFi Security Scan Aggregator")
                declaration.setDescription("Aggregates grype/trivy scan results, applies per-tool severity gates, and writes a markdown + json summary report")
                declaration.getTags().set(['deltafi', 'DeltaFi', 'security'])
            }
        }
    }
}
