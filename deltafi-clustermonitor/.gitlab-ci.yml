.clustermonitor:
  variables:
    PROJECT_NAME: deltafi-clustermonitor

.when-clustermonitor-changes:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/dev
        paths:
          - deltafi-clustermonitor/**/*

"🐳 Publish clustermonitor (GitLab)":
  extends:
    - .clustermonitor
    - .docker
    - .when-clustermonitor-changes

"🐳 Publish clustermonitor (docker.io)":
  extends:
    - .clustermonitor
    - .docker-multiarch
