# checkov --config-file — accepted by Checkov for the scanConfig task.
#
# Reference: https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html
#
# Checkov keys honored by this file:
#
#   skip-check:    list of check IDs to never report
#                  (e.g. CKV_K8S_15, CKV_DOCKER_2). Use this for rules whose
#                  intent doesn't apply to our deployment model.
#
#   check:         positive filter — if set, ONLY these checks run.
#                  Usually leave empty so all checks run.
#
#   skip-path:     additional path patterns to skip (one entry per pattern).
#                  Prefer extending the build's `securityScan.configSkipPaths`
#                  for repo-wide skips; use this file for branch-local skips.
#
#   soft-fail-on:  rules that report but never trip the gate
#                  (useful for rules under active triage).
#
# Every skip-check entry should carry a rationale comment immediately above it:
#   - a JIRA / issue link, OR
#   - the policy decision behind it ("we use tags, not digests, by design"), AND
#   - an expiration date or "re-check when <event>"
