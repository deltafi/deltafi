# grype --config — accepted by grype for image scans.
#
# Reference: https://github.com/anchore/grype#specifying-matches-to-ignore
#
# The `ignore` block is a list of rules. Each rule is matched against grype's
# findings and any matched finding is silently suppressed before the gate
# evaluates. Common rule keys:
#
#   - vulnerability       CVE / GHSA / etc.
#   - fix-state           "fixed" | "not-fixed" | "unknown" | "wont-fix"
#   - package.name        match by package name (regex allowed)
#   - package.type        e.g. "apk", "deb", "java-archive"
#   - vex-status          accepted | not_affected | etc. (when paired with VEX data)
#
# Every rule should carry a rationale comment immediately above it:
#   - a JIRA / issue link, OR
#   - "why" + an expiration date or "re-check when <event>"
#
# Examples (commented out — uncomment and edit when adding suppressions):
#
# ignore:
#   # https://example.atlassian.net/browse/SEC-1234
#   # Accepted: not reachable from any exposed endpoint. Re-check: 2026-12-31.
#   - vulnerability: CVE-2024-12345
#
#   # Accept all wont-fix Alpine APK findings until we move off Alpine 3.21.
#   # Re-check when we bump the Alpine base image.
#   - package:
#       type: apk
#     fix-state: wont-fix
#
# Honored by:  grype via `--config <path>`
# Generated by: scanImages (per-project `grype` task)

ignore: []
