{{- if and .Values.deltafi.auth.entityAuthorizer.enabled .Values.deltafi.auth.entityAuthorizer.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: entity-authorizer-config
data:
{{- range $key, $value := .Values.deltafi.auth.entityAuthorizer.config }}
  {{ $key }}: |
    {{- if kindIs "string" $value -}}
      {{ $value | nindent 4 }}
    {{- else -}}
      {{ $value | toYaml | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}