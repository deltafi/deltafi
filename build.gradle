def pathToCamelCase(String path) {
    return path.split(File.separator).collect { String part ->
        part[0].toUpperCase() + part.substring(1)
    }.join('')
}

task decompressDistBinaries {
    group = 'distribution'
    description = 'Decompress the distribution binaries'
}

