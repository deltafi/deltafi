.when-ui-changes:
  rules:
    # No redundant triggers for merge request events
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Always run on dev and main
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # # Run on branch commits if deltafi-ui has changed
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/dev
        paths:
          - deltafi-ui/**/*
    # Otherwise allow manual trigger
    - when: manual
      allow_failure: true

GUI Static Analysis:
  extends: .when-ui-changes
  tags:
    - light
  image: node:22.5.1-alpine
  stage: build
  allow_failure: false
  needs: []
  retry: 2
  script:
    - cd deltafi-ui
    # Install ui dependencies
    - |
      npm install
    # Run eslint
    - npm run lint

GUI License Check:
  extends: .when-ui-changes
  tags:
    - light
  image: node
  stage: build
  needs: []
  script:
    - ./deltafi-ui/licenseCheck.sh

# Shared configuration for Cypress test jobs
.cypress-test-base:
  image: deltafi/deltafi-ui-test:primevue4
  stage: test
  allow_failure: false
  needs:
    - job: "GUI Static Analysis"
  retry: 2
  variables:
    # Cypress performance optimizations
    CYPRESS_VIDEO: "false"
    CYPRESS_SCREENSHOT_ON_RUN_FAILURE: "true"
    # Reduce memory usage
    NODE_OPTIONS: "--max-old-space-size=4096"
    # Disable unnecessary browser features in CI
    ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu --disable-dev-shm-usage --disable-extensions"
    # Use Chrome instead of Electron for better CI performance
    CYPRESS_BROWSER: "chrome"
    CYPRESS_BAIL_ON_FAILURE: "true"
  before_script:
    - cd deltafi-ui
    # link node_modules from base image, then update any changed packages
    - ln -s /app/node_modules ./node_modules
    - npm run test-server &
    - npx wait-on -t 120000 http://127.0.0.1:8080
  artifacts:
    when: on_failure
    paths:
      - deltafi-ui/cypress/screenshots/
    expire_in: 1 week

GUI Tests:
  extends: .cypress-test-base
  timeout: 15m
  parallel:
    matrix:
      - CYPRESS_SPEC: "cypress/e2e/admin-suite.cy.ts"
      - CYPRESS_SPEC: "cypress/e2e/config-suite.cy.ts"
      - CYPRESS_SPEC: "cypress/e2e/deltafiles-suite.cy.ts"
      - CYPRESS_SPEC: "cypress/e2e/operations-suite.cy.ts"
      - CYPRESS_SPEC: "cypress/e2e/topology-suite.cy.ts"
  script:
    - 'echo "Running Cypress spec: $CYPRESS_SPEC"'
    - 'npx cypress run --config video=false --spec "$CYPRESS_SPEC"'
