.analytics:
  variables:
    PROJECT_NAME: deltafi-analytics

.when-analytics-changes:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/dev
        paths:
          - deltafi-analytics/**/*

"🐳 Publish analytics (GitLab)":
  extends:
    - .analytics
    - .docker
    - .when-analytics-changes

"🐳 Publish analytics (docker.io)":
  extends:
    - .analytics
    - .docker-multiarch
