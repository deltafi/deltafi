plugins {
	id 'docker-java'
	id 'org.springframework.boot' version "${springBootVersion}"
}

description = 'DeltaFi NATS Ingress'

dependencies {
    implementation project(':deltafi-common')
    implementation project(':deltafi-common-spring')
    implementation project(':deltafi-ingress')

    implementation 'org.springframework.boot:spring-boot-starter'

    implementation "io.nats:jnats:2.25.3"

    testImplementation project(':deltafi-common-test')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()
}

jar {
    // do not create the -plain.jar
    enabled = false
}

dockerPrepare {
    from bootJar, 'probe.sh'
}

