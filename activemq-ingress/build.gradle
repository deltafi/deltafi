plugins {
    id 'docker-java'
    id 'org.springframework.boot' version "${springBootVersion}"
}

description = 'DeltaFi ActiveMQ Classic Ingress'

dependencies {
    implementation project(':deltafi-common')
    implementation project(':deltafi-common-spring')
    implementation project(':deltafi-ingress')

    implementation 'org.springframework.boot:spring-boot-starter-activemq'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.apache.activemq:activemq-broker'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    buildInfo()
}

jar {
    // do not create the -plain.jar
    enabled = false
}

dockerPrepare {
    from bootJar, 'probe.sh'
}

