"TUI Build":
  tags:
    - light
  extends:
    - .golang
  stage: build
  script:
    - |
      pushd tui
      make debug-make build
      popd
      ls -la ../../deltafi
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

"TUI Test":
  tags:
    - light
  extends:
    - .golang
  stage: test
  when: manual
  script:
    - |
      pushd tui
      make debug-make test
      popd
      ls -la ../../deltafi
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

.web-terminal:
  variables:
    PROJECT_NAME: web-terminal
    TUI_DIR: ${CI_PROJECT_DIR}/tui
  before_script:
    - cp -rf ${CI_PROJECT_DIR}/orchestration ${TUI_DIR}/orchestration
    - mkdir -p ${TUI_DIR}/deltafi-docs
    - cp -rf ${CI_PROJECT_DIR}/deltafi-docs/docs ${TUI_DIR}/deltafi-docs/docs
    - rm -f ${TUI_DIR}/graphql/schema
    - cp -rf ${CI_PROJECT_DIR}/deltafi-core/src/main/resources/schema ${TUI_DIR}/graphql/schema
    - echo "${CI_COMMIT_TAG:-${CI_COMMIT_BRANCH}}" > ${TUI_DIR}/VERSION
    - cat ${TUI_DIR}/VERSION

"🐳 Publish web terminal (GitLab)":
  extends:
    - .web-terminal
    - .docker
  needs: []
  variables:
    CONTEXT: "${TUI_DIR}"
    DOCKERFILE: "${TUI_DIR}/Dockerfile"

"🐳 Publish web terminal (docker.io)":
  extends:
    - .web-terminal
    - .docker-multiarch
  needs: []
  variables:
    CONTEXT: "${TUI_DIR}"
    DOCKERFILE: "${TUI_DIR}/Dockerfile"
