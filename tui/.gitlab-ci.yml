.when-tui-changes:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # dev/main always run — they deploy
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # feature branches: only when tui or its embedded inputs changed
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: refs/heads/dev
        paths:
          - tui/**/*
          - deltafi-docs/docs/**/*
          - deltafi-core/src/main/resources/schema/**/*
          - orchestration/**/*

"TUI Build":
  tags:
    - light
  extends:
    - .golang
    - .when-tui-changes
  stage: build
  script:
    - |
      pushd tui
      make debug-make build
      popd
      ls -la ../../deltafi

"TUI Test":
  tags:
    - light
  extends:
    - .golang
    - .when-tui-changes
  stage: test
  when: manual
  script:
    - |
      pushd tui
      make debug-make test
      popd
      ls -la ../../deltafi

.web-terminal:
  variables:
    PROJECT_NAME: web-terminal
    TUI_DIR: ${CI_PROJECT_DIR}/tui
  before_script:
    - cp -rf ${CI_PROJECT_DIR}/orchestration ${TUI_DIR}/orchestration
    - mkdir -p ${TUI_DIR}/deltafi-docs
    - cp -rf ${CI_PROJECT_DIR}/deltafi-docs/docs ${TUI_DIR}/deltafi-docs/docs
    # bundle the freshly generated core-action docs (from the Core Build artifact)
    - mkdir -p ${TUI_DIR}/deltafi-docs/docs/core-actions
    - cp -f ${CI_PROJECT_DIR}/deltafi-core-actions/build/docs/*.md ${TUI_DIR}/deltafi-docs/docs/core-actions/ 2>/dev/null || true
    - rm -f ${TUI_DIR}/graphql/schema
    - cp -rf ${CI_PROJECT_DIR}/deltafi-core/src/main/resources/schema ${TUI_DIR}/graphql/schema
    - echo "${CI_COMMIT_TAG:-${CI_COMMIT_BRANCH}}" > ${TUI_DIR}/VERSION
    - cat ${TUI_DIR}/VERSION

"🐳 Publish web terminal (GitLab)":
  extends:
    - .web-terminal
    - .docker
    - .when-tui-changes
  variables:
    CONTEXT: "${TUI_DIR}"
    DOCKERFILE: "${TUI_DIR}/Dockerfile"

"🐳 Publish web terminal (docker.io)":
  extends:
    - .web-terminal
    - .docker-multiarch
  variables:
    CONTEXT: "${TUI_DIR}"
    DOCKERFILE: "${TUI_DIR}/Dockerfile"
