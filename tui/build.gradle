plugins {
    id 'license-plain'
    id 'docker-plain'
}

license {
    includes(["**/*.go"])
}

ext.dockerImageName = "deltafi/web-terminal"
afterEvaluate {
    docker {
        name "deltafi/web-terminal:${project.version}"
        tag "deltafi", "deltafi/web-terminal:${project.version}"
    }
}

dockerPrepare {
    exclude '.go'
    from('../orchestration') {
        into 'orchestration'
    }
    from('../deltafi-docs') {
        into 'deltafi-docs'
    }
    from('../VERSION') {
        into '.'
    }
}

task tuiClean(type: Exec) {
    commandLine 'make', 'debug-make', 'clean'
}

task tuiBuild(type: Exec) {
    commandLine 'make'
}

task tuiDist(type: Exec) {
    commandLine 'make', 'dist'
}

task tui() {
    dependsOn tuiBuild
}

task tuiTest(type: Exec) {
    dependsOn tuiBuild
    commandLine 'make', 'test'
}

clean.dependsOn tuiClean
rootProject.tui.dependsOn tuiBuild
rootProject.dist.dependsOn tuiDist
