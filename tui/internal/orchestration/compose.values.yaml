enable:
  local_object_storage: true
  local_artifact_storage: true

deltafi:
  java_ide:
    image: {{.JavaIDEContainer}}
    enabled: false
  java_devcontainer:
    image: {{.JavaDevContainer}}
    enabled: false
  core_actions:
    replicas: 1
    image: {{.Repo}}/deltafi-core-actions:{{.Tag}}
  core:
    image: {{.Repo}}/deltafi-core:{{.Tag}}
    envVar:
      HTTP_MAX_BODY_SIZE: 5G
    ssl:
      secret: ssl-secret
  core_worker:
    enabled: false
    replicas: 1
  auth:
    mode: disabled # basic, cert, or disabled
    entityResolver:
      enabled: false
      image: {{.Repo}}/deltafi-entity-resolver:{{.Tag}}
      port: 8080
      config:
        README: |-
          Add files to the site/values.yaml at deltafi.auth.entityResolver.config to inject files here
      ssl:
        secret: ssl-secret
    entityAuthorizer:
      enabled: false
      image: deltafi/deltafi-entity-authorizer:1.0.0
      url: http://deltafi-entity-authorizer:8081/
      config:
        README: |-
          Add files to the site/values.yaml at deltafi.auth.entityAuthorizer.config to inject files here
      ssl:
        secret: ssl-secret
  api:
    image: {{.Repo}}/deltafi-api:{{.Tag}}
    workers: 8
  activemq_ingress:
    image: {{.Repo}}/activemq-ingress:{{.Tag}}
  artemis_ingress:
    image: {{.Repo}}/artemis-ingress:{{.Tag}}
  nats_ingress:
    image: {{.Repo}}/nats-ingress:{{.Tag}}
  dirwatcher:
    enabled: true
    image: {{.Repo}}/deltafi-dirwatcher:{{.Tag}}
  egress_sink:
    enabled: true
    drop_metadata: false
    image: {{.Repo}}/deltafi-egress-sink:{{.Tag}}
  analytics:
    enabled: true
    image: {{.Repo}}/deltafi-analytics:{{.Tag}}
  nodemonitor:
    image: {{.Repo}}/deltafi-nodemonitor:{{.Tag}}
  artifactStorage:
    bucketName: deltafi-artifacts
    url: ""   # empty = use the same endpoint as deltafi.storage (shared s3proxy)
  webTerminal:
    enabled: false
    image: {{.Repo}}/web-terminal:{{.Tag}}
  plugins:
    ssl:
      secret: ssl-secret
  lookup:
    enabled: false
  globalEnv:
  pluginEnv:
  dashboards:
    enabled: true
  metrics:
    enabled: true
  logviewer:
    enabled: true
  logs:
    enabled: true
    logrotate:
      image: {{.LogrotateContainer}}
      interval: daily
      schedule:
        max_size: 50M
        keep: 30
      audit_schedule:
        max_size: 100M
        keep: 365

# nginx domain
ingress:
  domain: local.deltafi.org
  tls:
    enabled: false
    ssl_protocols: TLSv1.2 TLSv1.3
    ssl_ciphers: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    secrets:
      default: ssl-secret
  ui:
    http_port: 80
    https_port: 443
postgres:
  parameters:
    max_connections: 1000
    shared_buffers: 128MB
    log_statement: ddl
    log_min_duration_statement: 1000
    log_autovacuum_min_duration: 0
    random_page_cost: 1.1
    effective_io_concurrency: 200
    wal_compression: lz4
  lookup:
    parameters:
      max_connections: 100
      shared_buffers: 32MB
      log_statement: ddl
      log_min_duration_statement: 1000
      log_autovacuum_min_duration: 0
      random_page_cost: 1.1
      effective_io_concurrency: 200
      wal_compression: lz4

dependencies:
  grafana: {{.GrafanaContainer}}
  victoriametrics: {{.VictoriaMetricsContainer}}
  s3proxy: {{.S3ProxyContainer}}
  vector: {{.VectorContainer}}
  dozzle: {{.DozzleContainer}}
  nginx: {{.NginxContainer}}
  valkey: {{.ValkeyContainer}}
  postgres: {{.PostgresContainer}}
  postgres_lookup: {{.PostgresLookupContainer}}
