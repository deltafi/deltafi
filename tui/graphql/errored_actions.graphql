# ABOUTME: GraphQL operations for errored DeltaFile actions.
# ABOUTME: Provides mutations for resume, replay, acknowledge, and replayAndAcknowledge.

mutation ResumeMatching($filter: DeltaFilesFilter!, $resumeMetadata: [ResumeMetadata!]) {
  resumeMatching(filter: $filter, resumeMetadata: $resumeMetadata) {
    did
    success
    error
  }
}

mutation ReplayMatching($filter: DeltaFilesFilter!, $removeSourceMetadata: [String], $replaceSourceMetadata: [KeyValueInput]) {
  replayMatching(filter: $filter, removeSourceMetadata: $removeSourceMetadata, replaceSourceMetadata: $replaceSourceMetadata) {
    did
    success
    error
  }
}

mutation AcknowledgeMatching($filter: DeltaFilesFilter!, $reason: String) {
  acknowledgeMatching(filter: $filter, reason: $reason) {
    did
    success
    error
  }
}

mutation ReplayAndAcknowledgeMatching($filter: DeltaFilesFilter!, $reason: String!, $removeSourceMetadata: [String], $replaceSourceMetadata: [KeyValueInput]) {
  replayAndAcknowledgeMatching(filter: $filter, reason: $reason, removeSourceMetadata: $removeSourceMetadata, replaceSourceMetadata: $replaceSourceMetadata) {
    did
    replayDid
    success
    error
  }
}
